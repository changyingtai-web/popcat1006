<!DOCTYPE html>
<html lang="en">
<head>
    <title>POPCAT CLASSIC</title>
    <style>

        /* 1. 基本設定 */
        body {
            /* 移除預設邊距 */
            margin: 0;
            /* 設定字體 */
            font-family: sans-serif;
        }

        .container {
            /* 設定背景色 */
            background-color: #bdaa90;
            /* 防止文字被選取 */
            user-select: none;

            /* 讓內容佔滿整個視窗 */
            height: 100vh;

            /* 垂直排列內容 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 2. 標題圖片 */
        .title {
            /* 上方間距 */
            margin-top: 2em;

            /* 寬度設定 */
            width: 80%;
            max-width: 600px;
        }

        /* 3. 貓咪圖片 */
        .cat-img {
            /* 填滿剩餘空間 */
            flex: 1;

            /* 寬度設定 */
            width: 100%;
            max-width: 800px;

            /* 背景圖片設定 */
            background-position: bottom;
            background-size: contain;
            background-repeat: no-repeat;

            /* 文字置中 */
            text-align: center;
            /* 文字樣式 */
            color: white;
            font-size: 80px;
            font-weight: 900;
            -webkit-text-stroke: 3px black;

        }

        /* 4. 貓咪狀態 */
        #p {
            background-image: url("imgs/p.png");
        }
        #op {
            background-image: url("imgs/op.png");
        }
    </style>
</head>

<body>
<div class="container">
    <img class="title" src="imgs/popcat.svg" alt="POPCAT">
    <div class="cat-img" id="p">1000
    </div>


</div>
<script>
    let count = 0;
    const catCount = document.getElementById("p");
    catCount.innerHTML = count;    //也可以不寫，但是77 div那一行裡面的數字要改，例如改成0，這樣就會從0開始計數
    //htmlcount.innerTest =  count;

    function updateCount() {
        count++;
        console.log(count);
        catCount.innerHTML = count;

        catCount.id = "op";
    }
    //const updatecount = (){
    //htmlCount.innerTest =  count;
    //  count++;
    // console.log(count);
    // catCount.innerHTML = count;
    // catCount.id = "op";
    //}


    //const closeMouth = function closeMouth() {
    //    catCount.id = "p";
    //}
    //箭頭函式
    const cloeMounth = () => {    //不能更改
        catCount.id = "p";
    }   



    closeMoutth = cloeMounth;  //這行是為了讓closeMouth()可以被呼叫，因為原本的函式名稱是cloeMounth，這樣就可以用closeMouth()來呼叫cloeMounth()了


    //document.addEventListener("click", updateCount);     clic沒有單純點擊的動作，只有按鍵按下和放開的動作
    document.addEventListener("pointerdown", updateCount); 
    document.addEventListener("pointerup", cloeMounth);
    //按下滑鼠左鍵
    document.addEventListener("keydown", updateCount); 
    document.addEventListener("keyup", cloeMounth);
        
</script>

</body>
</html>
